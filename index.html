<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSSH</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <style>
        body {
            background: #1e1e1e;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        #connection-panel {
            background: #2d2d2d;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #3d3d3d;
            flex-wrap: wrap;
        }
        #connection-panel input[type="text"],
        #connection-panel input[type="password"] {
            padding: 8px;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            background: #1e1e1e;
            color: #fff;
            font-size: 14px;
        }
        #connection-panel input:focus {
            outline: none;
            border-color: #007acc;
        }
        #connection-panel label {
            color: #888;
            font-size: 13px;
        }
        #host { width: 140px; }
        #port { width: 70px; }
        #username { width: 100px; }
        #password { width: 120px; }
        #keyfile { display: none; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-connect {
            background: #0e639c;
            color: #fff;
        }
        .btn-connect:hover { background: #1177bb; }
        .btn-disconnect {
            background: #c53030;
            color: #fff;
        }
        .btn-disconnect:hover { background: #e53e3e; }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 13px;
            background: #444;
            color: #fff;
        }
        .btn-small:hover { background: #555; }
        #status {
            color: #888;
            font-size: 14px;
            min-width: 100px;
        }
        #status.connected { color: #48bb78; }
        #status.error { color: #f56565; }
        #terminal { flex: 1; padding: 10px; position: relative; }
        .xterm { padding: 5px; }
        #zmodem-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #zmodem-modal.active { display: flex; }
        #zmodem-modal .zmodem-box {
            background: #2d2d2d;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 30px 40px;
            text-align: center;
            color: #d4d4d4;
        }
        #zmodem-modal .zmodem-box p {
            margin: 0 0 15px 0;
            font-size: 15px;
        }
        #zmodem-modal .zmodem-box button {
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 0 6px;
        }
        #zmodem-modal .btn-upload {
            background: #0e639c;
            color: #fff;
        }
        #zmodem-modal .btn-upload:hover { background: #1177bb; }
        #zmodem-modal .btn-cancel {
            background: #555;
            color: #fff;
        }
        #zmodem-modal .btn-cancel:hover { background: #666; }
        .auth-methods {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: 10px;
            padding-left: 10px;
            border-left: 1px solid #3d3d3d;
        }
        .auth-methods label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            color: #888;
            font-size: 13px;
        }
        .auth-methods input[type="radio"] {
            cursor: pointer;
        }
        .auth-methods input[type="radio"]:checked + span {
            color: #fff;
        }
        #key-section {
            display: none;
            align-items: center;
            gap: 8px;
        }
        #key-info {
            color: #888;
            font-size: 12px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="connection-panel">
        <label>Host:</label>
        <input type="text" id="host" value="127.0.0.1" placeholder="IP Address">
        <label>Port:</label>
        <input type="text" id="port" value="22" placeholder="22">
        <label>User:</label>
        <input type="text" id="username" value="root" placeholder="Username">
        
        <div id="password-section">
            <label>Pass:</label>
            <input type="password" id="password" placeholder="Password">
        </div>
        
        <div id="key-section">
            <button class="btn btn-small" onclick="document.getElementById('keyfile').click()">选择私钥</button>
            <input type="file" id="keyfile" accept=".pem,.key,id_rsa,id_ed25519" onchange="loadKeyFile(event)">
            <span id="key-info">未选择</span>
        </div>
        
        <div class="auth-methods">
            <label>
                <input type="radio" name="auth-method" value="password" checked onchange="updateAuthMode()">
                <span>密码</span>
            </label>
            <label>
                <input type="radio" name="auth-method" value="key" onchange="updateAuthMode()">
                <span>密钥</span>
            </label>
        </div>
        
        <button class="btn btn-connect" id="connectBtn" onclick="connect()">连接</button>
        <button class="btn btn-disconnect" id="disconnectBtn" onclick="disconnect()" disabled>断开</button>
        <span id="status">未连接</span>
    </div>
    <div id="terminal">
        <div id="zmodem-modal">
            <div class="zmodem-box">
                <p id="zmodem-modal-text">检测到文件上传请求 (rz)，请选择文件</p>
                <button class="btn-upload" id="zmodem-choose-btn">选择文件</button>
                <button class="btn-cancel" id="zmodem-cancel-btn">取消</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tweetnacl/1.0.3/nacl-fast.min.js"></script>
    <script src="ssh.js?v=25"></script>
    <script src="zmodem_lib.js?v=2"></script>
    <script>
        let ssh = null;
        let term = null;
        let fitAddon = null;
        let privateKeyData = null;
        let zsentry = null;

        term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            fontFamily: 'Menlo, Monaco, "Courier New", monospace',
            theme: {
                background: '#1e1e1e',
                foreground: '#d4d4d4'
            }
        });
        fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal'));
        fitAddon.fit();

        term.onData((data) => {
            if (ssh) {
                ssh.sendData(data);
            }
        });

        function updateStatus(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = type || '';
        }

        function setButtons(connected) {
            document.getElementById('connectBtn').disabled = connected;
            document.getElementById('disconnectBtn').disabled = !connected;
            document.getElementById('host').disabled = connected;
            document.getElementById('port').disabled = connected;
            document.getElementById('username').disabled = connected;
            document.getElementById('password').disabled = connected;
            document.getElementById('keyfile').disabled = connected;
        }

        function updateAuthMode() {
            const authMethod = document.querySelector('input[name="auth-method"]:checked').value;
            document.getElementById('password-section').style.display = authMethod === 'password' ? 'inline' : 'none';
            document.getElementById('key-section').style.display = authMethod === 'key' ? 'flex' : 'none';
        }

        function loadKeyFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                privateKeyData = e.target.result;
                document.getElementById('key-info').textContent = file.name;
                document.getElementById('key-info').title = file.name;
            };
            reader.readAsText(file);
        }

        async function connect() {
            const host = document.getElementById('host').value.trim();
            const port = document.getElementById('port').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const authMethod = document.querySelector('input[name="auth-method"]:checked').value;

            if (!host || !port || !username) {
                updateStatus('请填写主机、端口和用户名', 'error');
                return;
            }

            if (authMethod === 'password' && !password) {
                updateStatus('请输入密码', 'error');
                return;
            }

            if (authMethod === 'key' && !privateKeyData) {
                updateStatus('请选择私钥文件', 'error');
                return;
            }

            if (ssh) {
                ssh.close();
            }

            term.clear();
            updateStatus('连接中...', '');
            
            try {
                const wsUrl = `wss://claw.603030.xyz:8443/websockify?host=${encodeURIComponent(host)}&port=${encodeURIComponent(port)}`;
                const ws = new WebSocket(wsUrl);
                
                ssh = new SSHConnection(ws);
                
                function setupZsentry() {
                    let zmodemActive = false;
                    zsentry = new Zmodem.Sentry({
                        to_terminal: (octets) => {
                            if (zmodemActive) return;
                            term.write(new Uint8Array(octets));
                        },
                        sender: (octets) => {
                            return ssh.sendData(new Uint8Array(octets));
                        },
                        on_retract: () => {
                            console.log('[ZMODEM] retract');
                        },
                        on_detect: (detection) => {
                            const zsession = detection.confirm();
                            zmodemActive = true;
                            term.write('\r\n');

                            if (zsession.type === 'receive') {
                                // sz: 服务器发送文件到浏览器
                                term.write('\x1b[33m[ZMODEM] 检测到文件下载...\x1b[0m\r\n');

                                zsession.on('offer', (xfer) => {
                                    const detail = xfer.get_details();
                                    term.write(`\x1b[33m[ZMODEM] 接收: ${detail.name} (${detail.size} bytes)\x1b[0m\r\n`);

                                    xfer.accept().then((payloads) => {
                                        Zmodem.Browser.save_to_disk(payloads, detail.name);
                                        term.write(`\x1b[32m[ZMODEM] 下载完成: ${detail.name}\x1b[0m\r\n`);
                                    }).catch((err) => {
                                        console.error('[ZMODEM] receive error:', err);
                                        term.write(`\x1b[31m[ZMODEM] 接收错误: ${err.message || err}\x1b[0m\r\n`);
                                    });
                                });

                                zsession.on('session_end', () => {
                                    zmodemActive = false;
                                    term.write('\x1b[33m[ZMODEM] 传输结束\x1b[0m\r\n');
                                    zsentry = null;
                                    setupZsentry();
                                });

                                zsession.start();

                            } else {
                                // rz: 服务器准备接收文件，浏览器上传
                                term.write('\x1b[33m[ZMODEM] 检测到文件上传请求，请点击弹窗选择文件...\x1b[0m\r\n');

                                const modal = document.getElementById('zmodem-modal');
                                const chooseBtn = document.getElementById('zmodem-choose-btn');
                                const cancelBtn = document.getElementById('zmodem-cancel-btn');
                                modal.classList.add('active');

                                function cleanupModal() {
                                    modal.classList.remove('active');
                                    chooseBtn.onclick = null;
                                    cancelBtn.onclick = null;
                                }

                                cancelBtn.onclick = () => {
                                    cleanupModal();
                                    term.write('\x1b[31m[ZMODEM] 取消传输\x1b[0m\r\n');
                                    zsession.abort();
                                    zsentry = null;
                                    setupZsentry();
                                };

                                chooseBtn.onclick = () => {
                                    const input = document.createElement('input');
                                    input.type = 'file';
                                    input.multiple = true;

                                    let fileSelected = false;
                                    input.onchange = (e) => {
                                        fileSelected = true;
                                        cleanupModal();
                                        const files = Array.from(e.target.files);
                                        if (!files.length) {
                                            term.write('\x1b[31m[ZMODEM] 未选择文件，取消传输\x1b[0m\r\n');
                                            zsession.abort();
                                            zsentry = null;
                                            setupZsentry();
                                            return;
                                        }

                                        Zmodem.Browser.send_files(zsession, files, {
                                            on_offer_response: (obj, xfer) => {
                                                if (xfer) {
                                                    term.write(`\x1b[33m[ZMODEM] 上传: ${obj.name} (${obj.size} bytes)\x1b[0m\r\n`);
                                                }
                                            },
                                            on_progress: (obj, xfer) => {},
                                            on_file_complete: (obj) => {
                                                term.write(`\x1b[32m[ZMODEM] 上传完成: ${obj.name}\x1b[0m\r\n`);
                                            },
                                        }).then(() => {
                                            term.write('\x1b[33m[ZMODEM] 传输结束\x1b[0m\r\n');
                                            zsentry = null;
                                            setupZsentry();
                                        }).catch((err) => {
                                            console.error('[ZMODEM] error:', err);
                                            term.write(`\x1b[31m[ZMODEM] 错误: ${err.message || err}\x1b[0m\r\n`);
                                            zsentry = null;
                                            setupZsentry();
                                        });
                                    };

                                    // Handle cancel (user closes picker without selecting)
                                    window.addEventListener('focus', function cancelHandler() {
                                        setTimeout(() => {
                                            if (!fileSelected) {
                                                cleanupModal();
                                                term.write('\x1b[31m[ZMODEM] 取消传输\x1b[0m\r\n');
                                                zsession.abort();
                                                zsentry = null;
                                                setupZsentry();
                                            }
                                            window.removeEventListener('focus', cancelHandler);
                                        }, 300);
                                    }, { once: true });

                                    input.click();
                                };
                            }
                        },
                    });
                }

                ssh.onData = (data) => {
                    if (!zsentry) {
                        term.write(new TextDecoder().decode(data));
                        return;
                    }
                    try {
                        const arr = data.buffer ? Array.from(data) : data;
                        // Feed in 8KB chunks to avoid overwhelming ZMODEM library
                        const chunkSize = 8192;
                        for (let i = 0; i < arr.length; i += chunkSize) {
                            zsentry.consume(arr.slice(i, i + chunkSize));
                        }
                    } catch(e) {
                        console.error('[ZMODEM] consume error:', e);
                    }
                };
                
                ssh.onClose = () => {
                    updateStatus('已断开', '');
                    setButtons(false);
                    term.write('\r\n\x1b[31m连接已断开\x1b[0m\r\n');
                };

                ssh.onDebug = (msg) => {
                    console.log('[SSH Debug]', msg);
                };

                await ssh.connect();
                updateStatus('认证中...', '');
                
                if (authMethod === 'key') {
                    await ssh.authenticateWithKey(username, privateKeyData);
                } else {
                    await ssh.authenticate(username, password);
                }
                
                updateStatus('已连接', 'connected');
                setButtons(true);
                
                const rows = term.rows;
                const cols = term.cols;
                await ssh.openShell(rows, cols);
                
                setupZsentry();
                
                setTimeout(() => term.focus(), 100);
                
            } catch (error) {
                console.error('Connection error:', error);
                updateStatus('连接失败', 'error');
                term.write('\r\n\x1b[31m错误: ' + error.message + '\x1b[0m\r\n');
                setButtons(false);
            }
        }
        
        function disconnect() {
            if (ssh) {
                ssh.close();
                ssh = null;
            }
        }
        
        window.onresize = () => {
            fitAddon.fit();
            if (ssh && term) {
                ssh.resize(term.rows, term.cols);
            }
        };
    </script>
</body>
</html>
